<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura propuesta para envío de correos del MVP</title>
  <desc id="description">El sitio web se conecta al backend Node.js, que envía correos mediante la cuenta SMTP corporativa configurada en cPanel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f7f2"/><stop offset="1" stop-color="#e6efe5"/></linearGradient>
    <linearGradient id="backend" x1="0" x2="1"><stop stop-color="#123d2b"/><stop offset="1" stop-color="#1e6647"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#09281b" flood-opacity=".15"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7d5b"/></marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#09281b}.subtitle{font:400 21px Arial,sans-serif;fill:#496557}.head{font:700 24px Arial,sans-serif;fill:#09281b}.text{font:400 18px Arial,sans-serif;fill:#365144}.small{font:400 16px Arial,sans-serif;fill:#496557}.white-head{font:700 26px Arial,sans-serif;fill:#fff}.white-text{font:400 18px Arial,sans-serif;fill:#e7f2e9}.label{font:700 15px Arial,sans-serif;fill:#2d6841;letter-spacing:1px}.node{fill:#fff;stroke:#c9dbc9;stroke-width:2}.line{fill:none;stroke:#4a7d5b;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="14" fill="#73c76a"/>
  <text x="100" y="98" class="title">Arquitectura de envío de correos — MVP</text>
  <text x="100" y="135" class="subtitle">Notificaciones transaccionales mediante el servidor SMTP corporativo de cPanel.</text>

  <g filter="url(#shadow)">
    <rect class="node" x="100" y="265" width="275" height="214" rx="22"/>
    <circle cx="150" cy="323" r="25" fill="#dcefd9"/><path d="M138 317h24v16h-24zM142 337h16" fill="none" stroke="#2d6841" stroke-width="4" stroke-linecap="round"/>
    <text x="195" y="325" class="head">Cliente / equipo</text>
    <text x="132" y="382" class="text">Navega en la web</text><text x="132" y="412" class="text">Solicita cotización</text><text x="132" y="442" class="text">Consulta pedidos</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="235" width="355" height="275" rx="22" fill="url(#backend)"/>
    <text x="536" y="295" class="white-head">Aplicación actual</text>
    <text x="536" y="337" class="white-text">Frontend + Backend Node.js</text>
    <line x1="536" y1="365" x2="818" y2="365" stroke="#ffffff44" stroke-width="2"/>
    <text x="536" y="404" class="white-text">• Cotizaciones</text><text x="536" y="436" class="white-text">• Pedidos y estados</text><text x="536" y="468" class="white-text">• Usuarios y clientes</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="980" y="235" width="300" height="275" rx="22"/>
    <rect x="1014" y="270" width="114" height="36" rx="18" fill="#e0f2dd"/><text x="1036" y="294" class="label">SMTP SSL</text>
    <text x="1014" y="351" class="head">Servicio de correo</text>
    <text x="1014" y="391" class="text">Recibe la solicitud</text><text x="1014" y="421" class="text">de envío del backend.</text>
    <text x="1014" y="467" class="small">Cuenta corporativa</text><text x="1014" y="490" class="small">administrada en cPanel</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="1335" y="265" width="170" height="214" rx="22"/>
    <circle cx="1420" cy="325" r="28" fill="#e0f2dd"/><path d="M1397 318l23 16 23-16v28h-46z" fill="none" stroke="#2d6841" stroke-width="4" stroke-linejoin="round"/>
    <text x="1364" y="391" class="head">Bandejas</text><text x="1362" y="420" class="text">Cliente</text><text x="1362" y="447" class="text">Ventas</text>
  </g>
  <path class="line" d="M375 372 H480"/><text x="387" y="345" class="label">ACCIÓN</text>
  <path class="line" d="M855 372 H960"/><text x="864" y="345" class="label">SMTP SEGURO</text>
  <path class="line" d="M1280 372 H1315"/><text x="1244" y="345" class="label">ENVÍO</text>

  <g filter="url(#shadow)">
    <rect class="node" x="310" y="650" width="980" height="190" rx="22"/>
    <text x="355" y="710" class="head">Configuración única antes de activar los envíos</text>
    <g transform="translate(355 748)">
      <circle cx="12" cy="0" r="12" fill="#73c76a"/><text x="36" y="7" class="text">Cuenta: ventas@costagrande.com.pe</text>
      <circle cx="382" cy="0" r="12" fill="#73c76a"/><text x="406" y="7" class="text">DNS: SPF + DKIM + DMARC</text>
      <circle cx="724" cy="0" r="12" fill="#73c76a"/><text x="748" y="7" class="text">Contraseña SMTP privada</text>
    </g>
    <text x="355" y="805" class="small">La clave se guarda en la configuración segura del servidor, nunca en el navegador ni en la base de datos pública.</text>
  </g>
  <path d="M1128 510 C1128 570 1040 584 1010 630" fill="none" stroke="#73a17b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="1135" y="580" class="label">AUTENTICACIÓN SMTP</text>

  <text x="100" y="910" class="small">Primeros correos sugeridos: confirmación de cotización al cliente · aviso al equipo de ventas · actualización de estado del pedido.</text>
  <text x="100" y="942" class="small">El servidor SMTP se conecta desde el backend; la contraseña nunca se entrega al navegador.</text>
</svg>
