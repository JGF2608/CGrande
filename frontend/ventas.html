<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventas | Costa Grande</title><link rel="stylesheet" href="/styles.css">
<style>.sales-main{max-width:1100px;margin:auto;padding:48px 7% 90px}.card{padding:22px;border:1px solid #d9e2ec;border-radius:12px;background:#fff;margin-top:22px}.row{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #e6edf3}.row:last-child{border-bottom:0}.row small{display:block;color:#627d98;margin-top:4px}.hidden{display:none}.logout{background:none;border:0;color:#b42318;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.price-field{display:flex;align-items:center;gap:8px}.price-field span{font-weight:700;color:#102a43}.price-field input{flex:1}.price-field input[readonly]{background:#e9eef2;border:0;border-radius:6px;color:#627d98;font-weight:700;cursor:not-allowed;box-shadow:none}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.row{flex-direction:column}}</style>
</head><body><header><a class="logo" href="/">COSTA GRANDE</a><nav><button id="logout" class="logout">Cerrar sesión</button></nav></header>
<main class="sales-main"><p class="eyebrow">PANEL DE VENTAS</p><h1>Cotizaciones y pedidos</h1><p>Revisa las cotizaciones recibidas y prepara los pedidos que hayan sido confirmados.</p>
<section id="password-change-section" class="card hidden"><h2>Actualiza tu contraseña</h2><p>Es tu primer acceso. Crea una contraseña propia antes de continuar.</p><form id="password-change-form"><label>Nueva contraseña<input name="password" type="password" minlength="8" required></label><label>Repite la nueva contraseña<input name="confirmation" type="password" minlength="8" required></label><button class="button">Guardar nueva contraseña</button><p id="password-message" class="message"></p></form></section>
<section class="card"><h2>Cotizaciones recibidas</h2><div id="quotes"></div></section>
<section id="order-form-section" class="card hidden"><h2>Preparar pedido</h2><p id="quote-reference"></p><form id="order-form"><div class="form-grid"><label>Producto<select name="product" required></select></label><label>Cantidad<input name="quantity" type="number" min="0.01" step="0.01" required></label><label>Precio unitario<div class="price-field"><span>S/.</span><input name="price" type="number" min="0.01" step="0.01" required></div></label><label>Unidad de medida<select name="unit" required></select></label><label>Precio total<div class="price-field"><span>S/.</span><input name="total" readonly></div></label><label>Fecha estimada de entrega<input name="estimatedDeliveryDate" type="date" required></label></div><button class="button">Crear pedido</button><button id="cancel-order" type="button" class="logout">Cancelar</button><p id="order-message" class="message"></p></form></section>
<section class="card"><h2>Pedidos</h2><div id="orders"></div></section>
</main><script src="/ventas.js"></script></body></html>
